{% extends "base.html" %}

{% block head %}
<meta property="og:type" content="website">
<meta property="og:title" content="Wall Breaekers">
<meta property="og:description" content="{{ code }} - {{ name }}">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="{{ url_for('static', filename='images/thumbnail.jpg') }}">
{% endblock %}

{% block content %}
<style>
h1 {
    text-align: center;
    font-size: 1500%;
    font-family: "Newsreader", serif;
    margin-bottom: 0;
    color: #ffffff;
}

label {
    text-align: center;
    width: 100%;
    display: block;
}
</style>

<div class="main">
    <h1>{{ code }}</h1>
    <label>{{ name }} - {{ description }}</label>
</div>
{% endblock %}
