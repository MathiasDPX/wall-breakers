{% extends "base.html" %}

{% block content %}
<article>
    <header>
        <h1><a href="{{ article.url }}" target="_blank">{{ article.headline }}</a></h1>
        <p>{{ article.subheadline }}</p>
    </header>

    <div id="content">
        {{ article.content|safe }}
    </div>
</article>
{% endblock %}
